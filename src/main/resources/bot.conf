# Каждое значение по умолчанию можно переопределить переменной окружения из следующей строки.
app.bot {
  token = ""
  token = ${?BOT_TOKEN}
  # Пояс для дат, пока тренер не открыл кабинет в браузере (оттуда берётся его собственный пояс).
  defaultTimeZone = "UTC"
  defaultTimeZone = ${?BOT_DEFAULT_TIME_ZONE}
  # После стольких неудачных доставок одного обновления диалог сбрасывается.
  maxUpdateAttempts = 3
  maxUpdateAttempts = ${?BOT_MAX_UPDATE_ATTEMPTS}
  # Сколько Telegram держит запрос обновлений. Не больше 24s: SDK обрывает запросы через 25 секунд.
  pollTimeout = 20s
  pollTimeout = ${?BOT_POLL_TIMEOUT}
}

app.platform {
  url = "http://127.0.0.1:8080"
  url = ${?PLATFORM_URL}
  key = ${TRAINING_SERVICE_KEY}
  # http:// разрешён только для локального адреса или с этим флагом.
  allowInsecure = false
  allowInsecure = ${?PLATFORM_ALLOW_INSECURE}
  connectTimeout = 5s
  connectTimeout = ${?PLATFORM_CONNECT_TIMEOUT}
  requestTimeout = 25s
  requestTimeout = ${?PLATFORM_REQUEST_TIMEOUT}
  # Пауза перед повтором, пока платформа или Telegram недоступны.
  retryDelay = 5s
  retryDelay = ${?PLATFORM_RETRY_DELAY}
}
